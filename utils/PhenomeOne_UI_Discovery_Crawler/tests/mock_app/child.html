<!doctype html>
<meta charset="utf-8">
<title>PhenomeOne (child surface)</title>
<style>
 body{font:14px/1.6 Segoe UI,sans-serif;margin:0;padding:14px 18px;color:#222}
 h1{font-size:18px;margin:0 0 8px}
 table{border-collapse:collapse;margin-top:8px}
 th,td{border:1px solid #ddd;padding:5px 9px;text-align:left}
 th{background:#f2f5f4}
</style>

<!--
  A child surface: whatever opened it - a target=_blank link, window.open(), or
  ordinary navigation - it carries real application content, so it must become
  part of the graph rather than being closed on sight.

  Served on both 127.0.0.1 and localhost. Which origin it is loaded from is what
  decides whether the crawler treats it as the application or as somebody
  else's site, so the SAME file proves both branches.
-->

<h1 id="head">Germplasm detail</h1>
<main aria-label="Germplasm detail">
  <table aria-label="Attributes">
    <tr><th>Name</th><td>INV-0001</td></tr>
    <tr><th>Type</th><td>Inbred</td></tr>
    <tr><th>Created</th><td>2025-02-11</td></tr>
  </table>
  <p><a href="surfaces.html" data-testid="child-back">Back to surfaces</a></p>
  <button data-testid="child-only">Child-only control</button>

  <!-- A second level INSIDE the child surface: scanning the landing state and
       closing the tab would map the door and none of the rooms. -->
  <p><a href="#view=pedigree" data-testid="child-deeper">Pedigree Tree</a></p>
  <!-- The hash, not the query: the state fingerprint is path + hash, so a
       query-only change would not register as a new state. -->
</main>


<script>
const params = new URLSearchParams(location.search);
const kind = params.get("kind") || "detail";
document.getElementById("head").textContent = "Germplasm detail (" + kind + ")";
document.title = "PhenomeOne child: " + kind;

// A child surface that is an authentication gate, not content. Built here
// rather than shipped hidden in the markup: the scanner records hidden elements,
// so a hidden gate would appear in the map from any scan of this page and there
// would be no way to prove the gate surface itself was never scanned.
if (kind === "gate") {
  document.querySelector('main[aria-label="Germplasm detail"]').remove();
  const g = document.createElement("section");
  g.setAttribute("aria-label", "Sign in");
  g.innerHTML = '<h2>Welcome back.</h2>' +
    '<label for="gate-user">User</label><input id="gate-user" type="text">' +
    '<label for="gate-pw">Password</label><input id="gate-pw" type="password">' +
    '<button data-testid="gate-continue">Continue</button>';
  document.body.appendChild(g);
}

// A child surface the application closes underneath the crawler. The parent
// crawl must survive it rather than dying on a closed page.
if (kind === "selfclose") {
  setTimeout(() => { try { window.close(); } catch (e) { } }, 900);
}
</script>
