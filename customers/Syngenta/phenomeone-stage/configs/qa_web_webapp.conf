name WebApp
environment prod
reset_password_valid_hours 5
work_dir /tmp/web_server
storage_handler S3
queue_handler SQS
cookie_Secure true
cookie_SameSite Lax
revision 21721
changelog 1272
email_sender support@phenome-networks.com
region eu-west-1
phenome_server_url http://127.0.0.1

<Model::PHN2>
    <connect_info>
        dsn               dbi:mysql:database=pheno20;host=unityqa-rds.c7tzpipnmc3m.eu-west-1.rds.amazonaws.com;port=3306
        user              phenome
        password
        quote_names       1
        mysql_enable_utf8 1
        mysql_local_infile 1
    </connect_info>
</Model::PHN2>

<S3>
    access_key
    secret_key
    auth_method V4
